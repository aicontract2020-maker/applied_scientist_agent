[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-harness"
version = "0.3.0"
description = "Preregistered experiments and explicit stopping decisions for research agents"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
research-harness = "research_harness.cli:main"

[tool.setuptools.packages.find]
include = ["research_harness*"]
