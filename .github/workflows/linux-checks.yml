name: Linux CPU and isolation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  data-review-portability:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline data qualification software checks (no extra dependencies)
        run: |
          python -m unittest discover -s tests -p test_data_qualification.py -v
          python -m unittest discover -s tests -p test_data_admission.py -v
          python -m unittest discover -s tests -p test_candidate_admission.py -v
          python -m examples.data_qualification.workflow --out runs/ci-data-review
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: OS tools and tested Codex CLI (no login)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap poppler-utils
          npm install -g @openai/codex@0.144.0
      - name: Check rootless namespaces; configure only bwrap if needed
        shell: bash
        run: |
          probe() {
            python - <<'PY'
          import subprocess
          from research_harness.linux_isolation import bwrap_base
          subprocess.run([*bwrap_base(False), '--remount-ro', '/', '--', '/usr/bin/true'], check=True)
          PY
          }
          if ! probe; then
            # Dedicated ephemeral CI runner only. No global AppArmor/sysctl disable.
            sudo install -m 644 docs/linux/bwrap.apparmor /etc/apparmor.d/research-harness-bwrap
            sudo apparmor_parser -r /etc/apparmor.d/research-harness-bwrap
            probe
          fi
      - name: Fresh CPU-only Python environment
        run: bash scripts/bootstrap.sh --skip-assets
      - name: Software tests (synthetic only)
        run: .venv-sr/bin/python -m unittest discover -s tests -v
      - name: Actual kernel boundary probes (no credentials or model calls)
        run: .venv-sr/bin/python scripts/check-linux-isolation.py
      - name: Actual preregistration rejection probes (no images or model calls)
        run: .venv-sr/bin/python scripts/check-intervention-review.py
      - name: Offline reviewed workflow
        run: .venv-sr/bin/python examples/local_demo/workflow.py --out runs/ci-offline
      - name: Task catalog and second-domain software fixture (no model or assets)
        run: |
          python -m research_harness task list
          python -m examples.tabular_demo.workflow --out runs/ci-tabular
          python -m examples.data_qualification.workflow --out runs/ci-data-review
      - name: Independent tabular environment and actual isolated synthetic baseline
        run: |
          bash scripts/bootstrap-tabular.sh
          .venv-tabular/bin/python scripts/check-tabular-isolation.py
          .venv-tabular/bin/python scripts/check-tabular-trial.py
          .venv-tabular/bin/python scripts/check-airfoil-isolation.py
          .venv-tabular/bin/python scripts/check-airfoil-trial.py
