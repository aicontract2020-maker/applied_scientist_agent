name: Targeted macOS Python 3.12 validation
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full repository commit SHA to validate
        required: true
        type: string
permissions:
  contents: read
jobs:
  macos-python312:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact commit and record environment
        env:
          EXPECTED_COMMIT: ${{ inputs.commit }}
        run: |
          python - <<'PY'
          import os, platform, re, subprocess, sys
          expected = os.environ['EXPECTED_COMMIT']
          assert re.fullmatch(r'[0-9a-f]{40}', expected), 'full lowercase commit SHA required'
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == expected, (actual, expected)
          assert sys.version_info[:2] == (3, 12)
          print({'commit': actual, 'python': sys.version, 'platform': platform.platform(), 'machine': platform.machine()})
          PY
      - name: Original C11 portability checks (offline, no scientific experiments)
        run: |
          python -m unittest discover -s tests -p test_data_qualification.py -v
          python -m unittest discover -s tests -p test_data_admission.py -v
          python -m unittest discover -s tests -p test_candidate_admission.py -v
          python -m unittest discover -s tests -p test_data_blocks.py -v
          python -m unittest discover -s tests -p test_unified_handoff.py -v
          python -m unittest discover -s tests -p test_airfoil_memory.py -v
          python -m unittest discover -s tests -p test_proposal_memory.py -v
          python -m unittest discover -s tests -p test_handoff_preview.py -v
          python -m examples.data_qualification.workflow --out runs/ci-data-review
      - name: Full dependency-free software suite
        run: python -m unittest discover -s tests -v
